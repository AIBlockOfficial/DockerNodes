version: '3'
services:

  mempool-node-0: &node-default
    image: ghcr.io/aiblockofficial/node-mempool:sha-3257de2
    environment:
      RUST_LOG: info,debug
    privileged: false
    user: "${UID}:${GID}"
    init: true
    ports: 
      - '12300:12300'
      - '3000:3000'
    volumes:  
      - /tmp/aiblock/mempool-0:/src
      - ./node_settings.toml:/etc/node_settings.toml
    command: mempool
    platform: linux/amd64
    networks:
      aiblock:
        ipv4_address: 172.28.0.3

  mempool-node-1:
    <<: *node-default
    ports: 
      - '12301:12301'
      - '3001:3000'
    volumes:  
      - /tmp/aiblock/mempool-1:/src
      - ./node_settings.toml:/etc/node_settings.toml
    command: mempool
    networks:
      aiblock:
        ipv4_address: 172.28.0.4
  
  storage-node-0:
    <<: *node-default
    ports:
      - '12310:12310'
      - '3010:3000'
    volumes:
      - /tmp/aiblock/storage-0:/src
      - ./node_settings.toml:/etc/node_settings.toml
    command: storage
    networks:
      aiblock:
        ipv4_address: 172.28.1.3

  storage-node-1:
    <<: *node-default
    ports:
      - '12311:12311'
      - '3011:3000'
    volumes:
      - /tmp/aiblock/storage-1:/src
      - ./node_settings.toml:/etc/node_settings.toml
    command: storage
    networks:
      aiblock:
        ipv4_address: 172.28.1.4

  miner-node-0:
    <<: *node-default
    depends_on: 
      - mempool-node-0
      - storage-node-0
      - mempool-node-1
      - storage-node-1
    ports:
      - '12320:12320'
      - '3020:3000'
    volumes:  
      - /tmp/aiblock/miner-0:/src
      - ./node_settings_miner_0.toml:/etc/node_settings.toml
    command: miner
    environment:
      - WITH_USER_INDEX=0
    networks:
      aiblock:
        ipv4_address: 172.28.2.3

  miner-node-1:
    <<: *node-default
    depends_on: 
      - mempool-node-0
      - storage-node-0
      - mempool-node-1
      - storage-node-1
    ports:
      - '12321:12321'
      - '3021:3000'
    volumes:  
      - /tmp/aiblock/miner-1:/src
      - ./node_settings_miner_1.toml:/etc/node_settings.toml
    command: miner
    environment:
      - WITH_USER_INDEX=0
    networks:
      aiblock:
        ipv4_address: 172.28.2.4

  miner-node-2:
    <<: *node-default
    depends_on: 
      - mempool-node-0
      - storage-node-0
      - mempool-node-1
      - storage-node-1
    ports:
      - '12322:12322'
      - '3022:3000'
    volumes:  
      - /tmp/aiblock/miner-2:/src
      - ./node_settings_miner_2.toml:/etc/node_settings.toml
    command: miner
    environment:
      - WITH_USER_INDEX=0
    networks:
      aiblock:
        ipv4_address: 172.28.2.5

  miner-node-3:
    <<: *node-default
    depends_on: 
      - mempool-node-0
      - storage-node-0
      - mempool-node-1
      - storage-node-1
    ports:
      - '12323:12323'
      - '3023:3000'
    volumes:  
      - /tmp/aiblock/miner-3:/src
      - ./node_settings_miner_3.toml:/etc/node_settings.toml
    command: miner
    environment:
      - WITH_USER_INDEX=0
    networks:
      aiblock:
        ipv4_address: 172.28.2.6

  miner-node-4:
    <<: *node-default
    depends_on: 
      - mempool-node-0
      - storage-node-0
      - mempool-node-1
      - storage-node-1
    ports:
      - '12324:12324'
      - '3024:3000'
    volumes:  
      - /tmp/aiblock/miner-4:/src
      - ./node_settings_miner_4.toml:/etc/node_settings.toml
    command: miner
    environment:
      - WITH_USER_INDEX=0
    networks:
      aiblock:
        ipv4_address: 172.28.2.7

  user-node-0:
    <<: *node-default
    depends_on: 
      - mempool-node-0
      - storage-node-0
      - mempool-node-1
      - storage-node-1
    ports:
      - '12340:12340'
      - '3030:3000'
    volumes:  
      - /tmp/aiblock/user-0:/src
      - ./node_settings.toml:/etc/node_settings.toml
    command: user
    networks:
      aiblock:
        ipv4_address: 172.28.3.3

networks:
  aiblock:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16